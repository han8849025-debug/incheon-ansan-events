name: 행사 목록 갱신

on:
  schedule:
    # UTC 기준. 한국시간으로 04:20 / 10:20 / 16:20 / 22:20 에 돈다.
    # 정각을 피한 건 그때 깃허브가 붐벼서 예약이 밀리기 때문.
    - cron: '20 1,7,13,19 * * *'
  workflow_dispatch:        # 깃허브에서 버튼으로 직접 돌릴 수도 있게
  push:
    branches: [main]
    paths: ['run.py', '.github/workflows/update.yml']

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 행사 긁어오기
        run: python run.py --no-open

      - name: 결과 확인
        run: |
          test -s index.html || { echo "index.html 이 비어 있음"; exit 1; }
          grep -c '"city"' index.html || true

      - name: 바뀌었으면 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "바뀐 게 없어서 커밋 안 함"
          else
            git commit -m "행사 목록 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi
